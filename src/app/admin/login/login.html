<div class="admin-theme login-wrapper">
  <!-- Background video in slow-motion -->
  <video #bgVideo class="bg-video" autoplay loop muted playsinline>
    <source src="https://res.cloudinary.com/drtvxt1v3/video/upload/ac_none/v1784272058/Untitled_design_6_wzg0xu.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <!-- Centered Split Card Container -->
  <div class="login-split-card">
    
    <!-- Left Panel: Translucent Form (Glassmorphism) -->
    <div class="login-form-panel">
      <div class="login-brand-header">
        <h2>Welcome</h2>
        <p>Sign in to your administration dashboard.</p>
      </div>

      <!-- Tab selectors for Password vs OTP -->
      <div class="login-tabs">
        <button type="button" [class.active]="loginMethod === 'password'" (click)="setLoginMethod('password')">Password</button>
        <button type="button" [class.active]="loginMethod === 'otp'" (click)="setLoginMethod('otp')">Email OTP</button>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="alert success" *ngIf="message">
          {{ message }}
        </div>
        <div class="alert error" *ngIf="error">
          {{ error }}
        </div>

        <!-- Common Email Input -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="email" 
            required 
            placeholder="admin@example.com"
            class="raw-input" />
        </div>

        <!-- Password Flow -->
        <div class="form-group" *ngIf="loginMethod === 'password'">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="password" 
            required 
            placeholder="••••••••"
            class="raw-input" />
        </div>

        <!-- OTP Flow -->
        <div class="form-group" *ngIf="loginMethod === 'otp' && otpSent">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="otp" style="margin-bottom: 0;">Enter 6-Digit OTP</label>
            <button type="button" 
                    [disabled]="resendCountdown > 0 || loading" 
                    (click)="resendOtp()" 
                    style="background: none; border: none; color: var(--gold); text-decoration: underline; cursor: pointer; padding: 0; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">
              <span *ngIf="resendCountdown > 0">Resend in {{ resendCountdown }}s</span>
              <span *ngIf="resendCountdown <= 0">Resend OTP</span>
            </button>
          </div>
          <input 
            type="text" 
            id="otp" 
            name="otp" 
            [(ngModel)]="otp" 
            required 
            maxlength="6"
            placeholder="000000"
            class="raw-input" />
        </div>

        <!-- Submit Buttons -->
        <!-- If OTP is selected but not sent yet, show "Send OTP" button -->
        <button type="button" *ngIf="loginMethod === 'otp' && !otpSent" [disabled]="!email || loading" (click)="sendOtp()" class="login-button">
          <span *ngIf="!loading">Send OTP Code</span>
          <span *ngIf="loading">Sending...</span>
        </button>

        <!-- Otherwise show main Login button -->
        <button type="submit" *ngIf="loginMethod === 'password' || (loginMethod === 'otp' && otpSent)" [disabled]="!loginForm.form.valid || loading" class="login-button">
          <span *ngIf="!loading">Login</span>
          <span *ngIf="loading">Please wait...</span>
        </button>
      </form>
    </div>

    <!-- Right Panel: Branding Illustration -->
    <div class="login-visual-panel">
      <div class="visual-overlay"></div>
      <div class="visual-content">
        <img src="/admin-assets/tourism_new_logo5.webp" alt="Tripura Tourism Logo" class="login-visual-logo">
        <span class="visual-tag">OFFICIAL PORTAL</span>
        <h1>Tripura Tourism</h1>
        <p>Explore the land of beautiful palaces, archaeological sites, temples, and rich tribal heritage.</p>
        
        <div class="visual-footer">
          <span>&copy; Department of Tourism, Govt. of Tripura</span>
        </div>
      </div>
    </div>

  </div>
</div>
