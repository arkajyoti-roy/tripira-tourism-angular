<div class="category-container">
  <div class="header-section">
    <h2>Change Admin Credentials</h2>
    <p>Update your admin panel login email and password.</p>
  </div>

  <div class="form-card" style="max-width: 500px; margin: 0 auto;">
    <h3>Edit Credentials</h3>
    
    <div class="alert success" *ngIf="message">{{ message }}</div>
    <div class="alert error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()" #credentialsForm="ngForm">
      <div class="form-group">
        <label>Login Email <span class="required">*</span></label>
        <input type="email" name="email" [(ngModel)]="email" required placeholder="Enter Login Email" class="raw-input" [disabled]="otpSent || loading" />
      </div>

      <div class="form-group">
        <label>Current Password <span class="required">*</span></label>
        <input type="password" name="currentPassword" [(ngModel)]="currentPassword" required placeholder="Enter Current Password to Verify" class="raw-input" [disabled]="otpSent || loading" />
      </div>

      <div class="form-group">
        <label>New Password <span class="optional">(leave blank to keep current)</span></label>
        <input type="password" name="newPassword" [(ngModel)]="newPassword" placeholder="Enter New Password (min. 4 chars)" class="raw-input" [disabled]="otpSent || loading" />
      </div>

      <!-- OTP Entry Field -->
      <div class="form-group" *ngIf="otpSent" style="border: 1px solid #000000; padding: 12px; background-color: #fffae6; margin-top: 15px;">
        <label style="color: #8a6d3b;">Enter OTP Code <span class="required">*</span></label>
        <input type="text" name="otp" [(ngModel)]="otp" required placeholder="Enter 6-digit OTP" class="raw-input" maxlength="6" [disabled]="loading" />
        <small style="display: block; margin-top: 5px; color: #666;">A verification OTP has been emailed to you.</small>
      </div>

      <div style="margin-top: 15px; display: flex; gap: 10px;">
        <button type="submit" [disabled]="loading || (!otpSent && !credentialsForm.form.valid)" class="btn-primary" style="flex: 1;">
          <span *ngIf="!otpSent && !loading">Request OTP Code</span>
          <span *ngIf="otpSent && !loading">Verify & Update</span>
          <span *ngIf="loading">Processing...</span>
        </button>

        <button type="button" class="btn-primary" style="background-color: #f0f0f0; color: #333;" *ngIf="otpSent" [disabled]="loading" (click)="cancelOtp()">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
