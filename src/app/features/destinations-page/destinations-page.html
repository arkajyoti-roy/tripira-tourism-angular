<div class="w-full min-h-screen relative bg-[#fdfbf7]">
  
  <!-- Fixed Hero Background -->
  <div class="fixed inset-0 w-full h-screen z-0 bg-black">
    <img loading="lazy" src="destination/destination.webp"  class="w-full h-full object-cover object-center">
    <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/30 to-black/70 pointer-events-none"></div>
  </div>

  <!-- Hero Section Content -->
  <div class="relative w-full h-screen flex flex-col items-center justify-center overflow-hidden z-10 bg-transparent pointer-events-none px-4">
    
    <div class="text-center mt-16 pointer-events-auto backdrop-blur-[2px] bg-black/10 p-6 md:p-8 lg:px-12 rounded-3xl border border-white/10 shadow-2xl transform transition-transform hover:scale-[1.02] duration-500 w-full max-w-[95%] sm:max-w-[80%] md:max-w-fit">
      <h1 class="text-white text-[1.8rem] sm:text-[2.5rem] md:text-[3.5rem] font-extrabold uppercase tracking-widest drop-shadow-2xl leading-[1.1] px-2 md:px-4" style="font-family: 'Arial Narrow', Arial, sans-serif;">
        Discover<br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#F2C14E] to-[#fff] text-[2.2rem] sm:text-[3rem] md:text-[4.5rem]">Destinations</span>
      </h1>
      <div class="w-24 md:w-32 h-1 bg-gradient-to-r from-transparent via-[#F2C14E] to-transparent mx-auto mt-4 md:mt-6 mb-4 md:mb-6"></div>
      <p class="text-white/90 text-xs sm:text-sm md:text-[1.1rem] font-medium flex items-center gap-2 md:gap-3 justify-center drop-shadow-md tracking-wider uppercase">
        <span class="hover:text-[#F2C14E] cursor-pointer transition-colors duration-300" routerLink="/">Home</span> 
        <span class="text-[#F2C14E]">&bull;</span> 
        <span class="text-white/70 text-center">Destinations</span>
      </p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="relative z-20 w-full bg-gradient-to-b from-[#fdfbf7] to-[#f4eee6] shadow-[0_-10px_25px_rgba(0,0,0,0.1)] py-16 md:py-24 lg:py-[100px] overflow-hidden">
    
    <!-- Decorative background elements -->
    <div class="absolute top-0 right-0 w-[300px] md:w-[600px] h-[300px] md:h-[600px] bg-[#F2C14E] rounded-full blur-[80px] md:blur-[150px] opacity-10 pointer-events-none transform translate-x-1/3 -translate-y-1/3"></div>
    <div class="absolute top-1/3 left-0 w-[300px] md:w-[600px] h-[300px] md:h-[600px] bg-[#8C1C13] rounded-full blur-[80px] md:blur-[150px] opacity-[0.08] pointer-events-none transform -translate-x-1/3 translate-y-1/3"></div>

    <div class="w-full max-w-[1600px] 2xl:max-w-[1800px] mx-auto px-4 sm:px-8 md:px-16 lg:px-24 flex flex-col relative z-10">
      
      <!-- TITLE SECTION -->
      <div class="text-center mb-12 md:mb-16 max-w-4xl mx-auto">
        <p class="text-[#F2C14E] drop-shadow-sm text-[1rem] md:text-[1.4rem] mb-2 tracking-wide font-medium" style="font-family: 'Comic Sans MS', cursive, sans-serif;">Ultimate Destinations</p>
        <h2 class="text-gray-800 text-[2rem] md:text-[2.5rem] lg:text-[3rem] font-extrabold tracking-tight uppercase leading-tight" style="font-family: 'Arial Narrow', Arial, sans-serif;">Choose Your Next Adventure</h2>
        <div class="w-16 md:w-24 h-1.5 bg-gradient-to-r from-[#F2C14E] to-[#8C1C13] mx-auto mt-4 md:mt-6 rounded-full mb-8"></div>
      </div>

      <!-- Loading State (Skeleton Loader) -->
      @if (loading()) {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
          @for (item of [1,2,3,4,5,6]; track item) {
            <div class="bg-white/50 backdrop-blur-sm p-3 rounded-[1.5rem] shadow-sm border border-gray-100 animate-pulse">
              <div class="w-full aspect-[3/2] bg-gray-200/50 rounded-[1.2rem] mb-4"></div>
              <div class="h-6 bg-gray-200/50 rounded-full w-3/4 mx-auto mb-3"></div>
            </div>
          }
        </div>
      }
      <!-- Loaded State -->
      @else {
        <!-- Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
          
          @for (dest of destinations(); track dest.id) {
            <a [routerLink]="['/tour', dest.id]" [queryParams]="{type: 'destinations'}" class="group block relative rounded-[1.5rem] bg-white p-2 md:p-3 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-white transition-all duration-500 transform hover:-translate-y-2 cursor-pointer z-10 hover:z-20">
              
              <!-- Image Wrapper -->
              <div class="relative w-full aspect-[3/2] overflow-hidden rounded-[1.2rem]">
                
                <!-- Image -->
                <img [src]="dest.image_url" [alt]="dest.name" 
                     loading="lazy" decoding="async"
                     class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-[1.03] rounded-[1.2rem]"
                     >
                     
                <!-- Dark Gradient Overlay (Default state) -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent transition-opacity duration-500 pointer-events-none group-hover:opacity-0 rounded-[1.2rem]"></div>
                
                <!-- Default State: Bottom Text -->
                <div class="absolute bottom-0 left-0 w-full p-5 pointer-events-none transition-all duration-500 group-hover:translate-y-4 group-hover:opacity-0">
                  <h3 class="text-white text-[1.2rem] md:text-[1.4rem] font-extrabold uppercase tracking-wide drop-shadow-lg truncate w-full" style="font-family: 'Arial Narrow', Arial, sans-serif;">
                    {{ dest.name }}
                  </h3>
                </div>

                <!-- Hover State: White Slide-up Panel -->
                <div class="absolute bottom-0 left-0 right-0 h-auto rounded-t-[1.2rem] bg-white/95 backdrop-blur-md p-6 pt-6 flex flex-col items-center transition-all duration-500 translate-y-[101%] group-hover:translate-y-0">
                  <h4 class="text-[#8C1C13] font-extrabold text-[1.2rem] md:text-[1.4rem] text-center mb-4 truncate w-full uppercase" style="font-family: 'Arial Narrow', Arial, sans-serif;">
                    {{ dest.name }}
                  </h4>
                  <p class="text-gray-700 text-[0.9rem] md:text-[1rem] text-center leading-relaxed font-medium line-clamp-4">
                    {{ dest.description }}
                  </p>
                  <div class="mt-4 text-[#F2C14E] font-bold text-sm tracking-wider uppercase flex items-center gap-1 group/btn">
                    Explore
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform transition-transform group-hover/btn:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                  </div>
                </div>
                
              </div>
              
            </a>
          }

        </div>
      }

    </div>
  </div>
</div>
