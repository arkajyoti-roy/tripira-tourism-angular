<div class="w-full min-h-screen relative">
  
  <!-- Fixed Hero Background -->
  <img loading="lazy" src="destination/destination.png" onerror="this.src=''" class="fixed inset-0 w-full h-screen object-cover z-0">
  <div class="fixed inset-0 bg-black/40 z-0 pointer-events-none"></div>

  <!-- Hero Section Content -->
  <div class="relative w-full h-screen flex flex-col items-center justify-center overflow-hidden z-10 bg-transparent pointer-events-none">
    
    <div class="text-center mt-16 pointer-events-auto">
      <h1 class="text-white text-[2.5rem] md:text-[3.5rem] font-normal font-['Impact',_'Arial_Black',_sans-serif] uppercase tracking-wide drop-shadow-lg" style="font-family: 'Impact', 'Arial Black', sans-serif;">
        {{ categoryName() }}
      </h1>
      <p class="text-white/90 text-sm md:text-base font-medium mt-2 flex items-center gap-2 justify-center drop-shadow-md">
        <span class="hover:text-[#8C593B] cursor-pointer transition-colors" routerLink="/">Home</span> 
        <span class="text-xs">&gt;</span> 
        <span class="text-white">{{ categoryName() }}</span>
      </p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="relative z-20 w-full px-4 sm:px-8 lg:px-12 py-[60px] pb-[100px] text-center bg-[#e6e8e8] shadow-[0_-10px_25px_rgba(0,0,0,0.1)]">
    
    <div class="mb-10">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap');
      </style>
      <p class="text-[#8C593B] text-[1.2rem] font-bold mb-1 tracking-wider" style="font-family: 'Kaushan Script', cursive;">Explore Places</p>
      <h2 class="text-gray-800 text-[2rem] md:text-[2.5rem] font-bold font-['Impact',_'Arial_Black',_sans-serif] uppercase tracking-wide opacity-80" style="font-family: 'Impact', 'Arial Black', sans-serif;">{{ categoryName() }}</h2>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8">
      
      @for (dest of destinations(); track dest.id) {
        <a [routerLink]="['/tour', dest.id]" [queryParams]="{type: 'destinations'}" class="bg-white p-2 rounded-md shadow-[0_8px_20px_rgba(0,0,0,0.08)] hover:shadow-[0_8px_25px_rgba(0,0,0,0.15)] transition-all duration-300 group cursor-pointer overflow-hidden block text-left">
          
          <!-- Image Wrapper -->
          <div class="relative w-full aspect-[3/2] overflow-hidden rounded-md">
            
            <!-- Image (Blurs on hover) -->
            <img [src]="dest.image_url" [alt]="dest.name" 
                 loading="lazy" decoding="async"
                 class="w-full h-full object-cover transition-all duration-500 group-hover:scale-110 group-hover:blur-sm rounded-md"
                 onerror="this.src=''">
                 
            <!-- Very faint full-cover overlay -->
            <div class="absolute inset-0 bg-black/10 transition-opacity duration-300 pointer-events-none group-hover:opacity-0"></div>
            
            <!-- Default State: Centered Text -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none p-4 transition-opacity duration-500 group-hover:opacity-0">
              <h3 class="text-white text-[1.1rem] md:text-[1.35rem] font-black font-sans text-center leading-tight tracking-wide drop-shadow-md truncate w-full">
                {{ dest.name }}
              </h3>
            </div>

            <!-- Hover State: White Slide-up Panel -->
            <div class="absolute bottom-0 left-0 right-0 h-[82%] bg-white p-4 md:p-5 flex flex-col transition-transform duration-500 translate-y-full group-hover:translate-y-0">
              <h4 class="text-[#8C593B] font-bold text-[1.1rem] md:text-[1.25rem] text-center mb-3 truncate w-full">
                {{ dest.name }}
              </h4>
              <p class="text-gray-700 text-[0.85rem] md:text-[0.95rem] text-center leading-relaxed font-medium line-clamp-3">
                {{ dest.description }}
              </p>
            </div>
            
          </div>
          
        </a>
      }
      
      @if (destinations().length === 0) {
        <div class="col-span-full py-12 text-gray-500 font-medium">
          No destinations found for this category yet.
        </div>
      }

    </div>
  </div>
</div>
