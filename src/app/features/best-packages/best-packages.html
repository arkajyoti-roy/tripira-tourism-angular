<div class="w-full min-h-screen relative bg-[#f4f5f5] pt-[150px]">
  
  <!-- Content Section -->
  <div class="relative z-20 w-full py-[60px] md:py-[80px] bg-[#f4f5f5]">
    
    <div class="w-full max-w-[1200px] mx-auto px-4 relative z-10">
      
      <!-- Section Title -->
      <div class="text-center mb-12">
        <h2 class="text-gray-800 text-[1.8rem] md:text-[2.2rem] font-bold font-sans tracking-wide">
          Visit Our Best Places
        </h2>
      </div>

      <!-- Loading State -->
      @if (isLoading()) {
      <div class="w-full bg-white rounded-md shadow-sm border border-gray-200 p-8 flex justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600"></div>
      </div>
      }
      
      <!-- Grid -->
      @if (!isLoading()) {
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (dest of destinations(); track dest.id) {
        <a [routerLink]="['/tour', dest.id]" [queryParams]="{type: 'destinations'}" class="bg-white rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.05)] hover:shadow-[0_8px_25px_rgba(0,0,0,0.12)] p-6 transition-all duration-300 group block relative">
          
          <div class="flex flex-col h-full relative">
            <!-- Circular Image -->
            <div class="w-[100px] h-[100px] rounded-full overflow-hidden mb-5 mx-auto border-4 border-gray-50 shadow-sm relative z-10 bg-gray-100">
              <img [src]="dest.image_url" [alt]="dest.name" loading="lazy" decoding="async" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 rounded-md" onerror="this.src=''">
            </div>
            
            <!-- Title -->
            <h3 class="text-center text-gray-900 font-bold text-[1.05rem] md:text-[1.1rem] mb-2 font-sans line-clamp-1 leading-tight">
              {{ dest.name }}
            </h3>
            
            <!-- Description -->
            <p class="text-gray-500 text-[0.8rem] md:text-[0.85rem] text-center leading-relaxed font-medium line-clamp-3 mb-6 flex-grow">
              {{ dest.description }}
            </p>
            
            <!-- Explore More link -->
            <div class="text-center mt-auto pb-1">
              <span class="text-blue-500 font-semibold text-[0.85rem] group-hover:text-red-500 transition-colors inline-flex items-center gap-1">
                Explore More <span class="text-[1rem] leading-none">&rarr;</span>
              </span>
            </div>
          </div>
          
        </a>
        }
      </div>
      }

    </div>
  </div>
</div>
