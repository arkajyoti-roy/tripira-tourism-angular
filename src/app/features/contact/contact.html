<div class="w-full min-h-screen relative bg-[#e6e8e8]">
  <!-- Hero Section -->
  <!-- User will provide image -->
  <img loading="lazy" src="/tourist corner/act.webp" class="fixed inset-0 w-full h-screen object-cover z-0">
  <div class="fixed inset-0 bg-black/40 z-0 pointer-events-none"></div>

  <div class="relative w-full h-[50vh] min-h-[400px] flex flex-col items-center justify-center overflow-hidden z-10 bg-transparent pointer-events-none">
    <div class="text-center mt-16 pointer-events-auto">
      <h1 class="text-white text-[2.5rem] md:text-[4rem] font-bold tracking-wide drop-shadow-lg leading-tight px-4" style="font-family: 'Impact', 'Arial Black', sans-serif;">
        Contact Us
      </h1>
      <p class="text-white text-sm md:text-base font-medium mt-4 flex items-center gap-2 justify-center drop-shadow-md">
        <span class="hover:text-[#8C593B] cursor-pointer transition-colors" routerLink="/">Home</span> 
        <span class="text-xs">&gt;</span> 
        <span>Contact Us</span>
      </p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="relative z-20 w-full py-[60px] md:py-[80px] bg-[#e6e8e8]">
    <div class="w-full max-w-[1000px] mx-auto px-4 md:px-8 font-sans">
      
      <!-- Loading State -->
      <div *ngIf="loading()" class="text-center py-12">
        <p class="text-gray-600 text-lg">Loading contact information...</p>
      </div>

      <!-- Error State -->
      <div *ngIf="error()" class="text-center py-12">
        <p class="text-red-500 text-lg">{{ error() }}</p>
      </div>

      <!-- Contact Info Cards -->
      <div *ngIf="!loading() && !error() && contacts().length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-[1200px] mx-auto">
        
        <div *ngFor="let contact of contacts()" class="bg-white rounded-md p-8 shadow-[0_4px_20px_rgba(0,0,0,0.06)] border border-gray-100 flex flex-col gap-6 w-full">
          <h2 class="text-[1.3rem] font-bold text-gray-800 border-b border-gray-100 pb-4">{{ contact?.name }}</h2>
          
          <div class="flex flex-col gap-4 text-gray-700">
            <div class="flex items-start gap-4">
              <span class="material-symbols-outlined text-[#69422A] text-[1.5rem] mt-1">location_on</span>
              <div>
                <p class="font-bold text-[0.95rem] text-gray-800 mb-1">Address</p>
                <p class="text-[0.95rem] leading-relaxed">{{ contact?.address }}</p>
              </div>
            </div>

            <div class="flex items-start gap-4" *ngIf="contact?.phone">
              <span class="material-symbols-outlined text-[#69422A] text-[1.5rem] mt-1">call</span>
              <div>
                <p class="font-bold text-[0.95rem] text-gray-800 mb-1">Phone</p>
                <p class="text-[0.95rem]"><a href="tel:{{ contact?.phone }}" class="hover:text-[#69422A] transition-colors">{{ contact?.phone }}</a></p>
              </div>
            </div>

            <div class="flex items-start gap-4" *ngIf="contact?.fax">
              <span class="material-symbols-outlined text-[#69422A] text-[1.5rem] mt-1">fax</span>
              <div>
                <p class="font-bold text-[0.95rem] text-gray-800 mb-1">Fax</p>
                <p class="text-[0.95rem]">{{ contact?.fax }}</p>
              </div>
            </div>

            <div class="flex items-start gap-4" *ngIf="contact?.email">
              <span class="material-symbols-outlined text-[#69422A] text-[1.5rem] mt-1">mail</span>
              <div>
                <p class="font-bold text-[0.95rem] text-gray-800 mb-1">Email</p>
                <p class="text-[0.95rem]"><a href="mailto:{{ contact?.email }}" class="hover:text-[#69422A] transition-colors">{{ contact?.email }}</a></p>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
