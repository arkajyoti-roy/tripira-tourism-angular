<div class="w-full min-h-screen relative">
  
  <!-- Fixed Hero Background -->
  <img loading="lazy" src="/accommodation/where to stay/hero.png" onerror="this.src=''" class="fixed inset-0 w-full h-screen object-cover z-0">
  <div class="fixed inset-0 bg-black/40 z-0 pointer-events-none"></div>

  <!-- Hero Section Content -->
  <div class="relative w-full h-screen flex flex-col items-center justify-center overflow-hidden z-10 bg-transparent pointer-events-none">
    
    <div class="text-center mt-16 pointer-events-auto">
      <h1 class="text-white text-[2.5rem] sm:text-[3.5rem] md:text-[4.5rem] font-normal tracking-wide leading-tight px-4" style="font-family: 'Impact', 'Arial Black', sans-serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">
        Where To Stay
      </h1>
      <p class="text-white text-sm md:text-base font-medium mt-4 flex items-center gap-2 justify-center drop-shadow-md">
        <span class="hover:text-[#8C593B] cursor-pointer transition-colors" routerLink="/">Home</span> 
        <span class="text-xs">&gt;</span> 
        <span>Where To Stay</span>
      </p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="relative z-20 w-full bg-[#e6e8e8] py-[60px] md:py-[80px] overflow-hidden">
    
    <!-- Faint Map Watermark -->
    <img loading="lazy" src="about/tripura-map-watermark.png" onerror="this.style.display='none'" class="absolute top-[5%] left-[5%] w-[80%] md:w-[50%] object-contain opacity-[0.05] pointer-events-none z-0">
    <img loading="lazy" src="about/tripura-map-watermark.png" onerror="this.style.display='none'" class="absolute top-[40%] right-[5%] w-[80%] md:w-[50%] object-contain opacity-[0.05] pointer-events-none z-0">
    
    <div class="w-full max-w-[1300px] mx-auto px-4 sm:px-6 md:px-8 relative z-10">
      
      <!-- Lodges Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-x-8 gap-y-12">
        @for(lodge of lodges(); track $index){
        <a [routerLink]="['/tour', lodge.aid]" [queryParams]="{type: 'govt_accommodations'}" class="flex flex-col group cursor-pointer block">
          <div class="relative w-full aspect-[4/3] rounded-lg overflow-hidden shadow-sm bg-white/50">
            @if(lodge.image_url){
            <img loading="lazy" [src]="lodge.image_url" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 rounded-md">
            }
          </div>
          <h3 class="font-normal text-gray-800 text-2xl mt-4">
            {{ lodge.name }}
          </h3>
        </a>
}
      </div>

    </div>
  </div>
</div>
