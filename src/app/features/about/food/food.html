<div class="w-full min-h-screen relative bg-[#fdfbf7]">
  
  <!-- Fixed Hero Background -->
  <div class="fixed inset-0 w-full h-screen z-0 bg-black">
    <img loading="lazy" src="/about/food/food.webp"  class="w-full h-full object-cover object-center">
    <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/30 to-black/70 pointer-events-none"></div>
  </div>

  <!-- Hero Section Content -->
  <div class="relative w-full h-screen flex flex-col items-center justify-center overflow-hidden z-10 bg-transparent pointer-events-none px-4">
    
    <div class="text-center mt-16 pointer-events-auto backdrop-blur-[2px] bg-black/10 p-6 md:p-8 lg:px-12 rounded-3xl border border-white/10 shadow-md transform transition-transform hover:scale-[1.02] duration-500 w-full max-w-[95%] sm:max-w-[80%] md:max-w-fit">
      <h1 class="text-white text-[1.8rem] sm:text-[2.5rem] md:text-[3.5rem] font-extrabold uppercase tracking-widest drop-shadow-md leading-[1.1] px-2 md:px-4" style="font-family: 'Arial Narrow', Arial, sans-serif;">
        Traditional Food <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#F2C14E] to-[#fff] text-[2.2rem] sm:text-[3rem] md:text-[4.5rem]">Cuisines of Tripura</span>
      </h1>
      <div class="w-24 md:w-32 h-1 bg-gradient-to-r from-transparent via-[#F2C14E] to-transparent mx-auto mt-4 md:mt-6 mb-4 md:mb-6"></div>
      <p class="text-white/90 text-xs sm:text-sm md:text-[1.1rem] font-medium flex items-center gap-2 md:gap-3 justify-center drop-shadow-md tracking-wider uppercase">
        <span class="hover:text-[#F2C14E] cursor-pointer transition-colors duration-300" routerLink="/">Home</span> 
        <span class="text-[#F2C14E]">&bull;</span> 
        <span class="text-white/70 text-center">Food Cuisines</span>
      </p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="relative z-20 w-full bg-gradient-to-b from-[#fdfbf7] to-[#f4eee6] shadow-[0_-10px_25px_rgba(0,0,0,0.1)] py-16 md:py-24 lg:py-[100px] overflow-hidden">
    
    <!-- Decorative background elements -->
    <div class="absolute top-0 right-0 w-[300px] md:w-[600px] h-[300px] md:h-[600px] bg-[#F2C14E] rounded-full blur-[80px] md:blur-[150px] opacity-10 pointer-events-none transform translate-x-1/3 -translate-y-1/3"></div>
    <div class="absolute top-1/3 left-0 w-[300px] md:w-[600px] h-[300px] md:h-[600px] bg-[#8C1C13] rounded-full blur-[80px] md:blur-[150px] opacity-[0.08] pointer-events-none transform -translate-x-1/3 translate-y-1/3"></div>
    <div class="absolute bottom-1/4 right-0 w-[300px] md:w-[600px] h-[300px] md:h-[600px] bg-[#F2C14E] rounded-full blur-[80px] md:blur-[150px] opacity-10 pointer-events-none transform translate-x-1/3 translate-y-1/3"></div>
    <div class="absolute bottom-0 left-0 w-[300px] md:w-[600px] h-[300px] md:h-[600px] bg-[#8C1C13] rounded-full blur-[80px] md:blur-[150px] opacity-[0.08] pointer-events-none transform -translate-x-1/3 translate-y-1/3"></div>

    <div class="w-full max-w-[1600px] 2xl:max-w-[1800px] mx-auto px-4 sm:px-8 md:px-16 lg:px-24 flex flex-col gap-16 md:gap-24 lg:gap-[120px] relative z-10">
      
      <!-- TITLE SECTION -->
      <div class="text-center mb-4 md:mb-8">
        <p class="text-[#F2C14E] drop-shadow-sm text-[1rem] md:text-[1.4rem] mb-2 tracking-wide font-medium" style="font-family: 'Comic Sans MS', cursive, sans-serif;">Authentic Flavors</p>
        <h2 class="text-gray-800 text-[2rem] md:text-[2.5rem] lg:text-[3rem] font-extrabold tracking-tight uppercase" style="font-family: 'Arial Narrow', Arial, sans-serif;">Gastronomy of Tripura</h2>
        <div class="w-16 md:w-24 h-1.5 bg-gradient-to-r from-[#F2C14E] to-[#8C1C13] mx-auto mt-4 md:mt-6 rounded-full"></div>
      </div>

      <div class="flex flex-col gap-16 md:gap-24">
        
        <!-- Food Items Loop -->
        <div *ngFor="let item of foodItems; let i = index" class="w-full relative group">
          
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
            
            <!-- Even index: 0, 2, 4... (Text Left, Image Right) -->
            <ng-container *ngIf="i % 2 === 0">
              <div class="lg:col-span-8 relative p-6 md:p-8 lg:px-10 bg-white/70 backdrop-blur-xl rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white group-hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all duration-500 order-2 lg:order-1">
                <div class="absolute -top-4 -left-2 md:-top-6 md:-left-4 text-[6rem] md:text-[8rem] text-[#8C1C13]/5 font-serif leading-none select-none pointer-events-none">"</div>
                <div class="relative z-10 text-gray-700 text-sm sm:text-base md:text-lg leading-relaxed text-left md:text-justify space-y-4 font-medium">
                  <h3 class="text-xl md:text-2xl lg:text-3xl font-extrabold text-[#8C1C13] mb-4 uppercase" style="font-family: 'Arial Narrow', Arial, sans-serif;">{{ item.name }}</h3>
                  <p class="first-letter:text-4xl sm:first-letter:text-5xl first-letter:font-bold first-letter:text-[#8C1C13] first-letter:mr-2 first-letter:float-left first-letter:leading-[0.9] first-line:tracking-wide">
                    {{ item.description }}
                  </p>
                </div>
              </div>
              
              <div class="lg:col-span-4 relative order-1 lg:order-2">
                <div class="absolute inset-0 bg-gradient-to-tr from-[#8C1C13]/30 to-[#F2C14E]/30 transform translate-x-[3px] translate-y-[3px] md:translate-x-[3px] md:translate-y-[3px] rounded-[2rem] -z-10 transition-transform duration-500 group-hover:translate-x-[5px] group-hover:translate-y-[5px] md:group-hover:translate-x-[5px] md:group-hover:translate-y-[5px]"></div>
                <div class="bg-white p-2 md:p-3 rounded-[2rem] shadow-md border border-gray-100/50 overflow-hidden">
                  <img loading="lazy" [src]="item.image" class="w-full h-auto object-cover rounded-[1.2rem] aspect-square md:aspect-[4/3] transform transition-transform duration-700 hover:scale-[1.02]">
                </div>
              </div>
            </ng-container>

            <!-- Odd index: 1, 3, 5... (Image Left, Text Right) -->
            <ng-container *ngIf="i % 2 !== 0">
              <div class="lg:col-span-4 relative order-2 lg:order-1">
                <div class="absolute inset-0 bg-gradient-to-bl from-[#F2C14E]/30 to-[#8C1C13]/30 transform -translate-x-[3px] translate-y-[3px] md:-translate-x-[3px] md:translate-y-[3px] rounded-[2rem] -z-10 transition-transform duration-500 group-hover:-translate-x-[5px] group-hover:translate-y-[5px] md:group-hover:-translate-x-[5px] md:group-hover:translate-y-[5px]"></div>
                <div class="bg-white p-2 md:p-3 rounded-[2rem] shadow-md border border-gray-100/50 overflow-hidden">
                  <img loading="lazy" [src]="item.image" class="w-full h-auto object-cover rounded-[1.2rem] aspect-square md:aspect-[4/3] transform transition-transform duration-700 hover:scale-[1.02]">
                </div>
              </div>
              
              <div class="lg:col-span-8 order-1 lg:order-2 relative p-6 md:p-8 lg:px-10 bg-gradient-to-br from-[#8C1C13]/[0.03] to-transparent rounded-[2rem] border-l-[6px] border-[#8C1C13] shadow-[0_8px_30px_rgb(0,0,0,0.02)] hover:bg-[#8C1C13]/[0.05] transition-colors duration-500">
                <div class="absolute -top-6 -right-2 md:-top-8 md:-right-4 text-[#8C1C13]/5 pointer-events-none select-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" class="md:w-[80px] md:h-[80px]" viewBox="0 0 24 24" fill="currentColor"><path d="M11 4H4C2.9 4 2 4.9 2 6V13C2 14.1 2.9 15 4 15H7.5C7.5 17.5 5.5 19.5 3 19.5V22C7.1 22 10.5 18.6 10.5 14.5V4ZM22 4H15C13.9 4 13 4.9 13 6V13C13 14.1 13.9 15 15 15H18.5C18.5 17.5 16.5 19.5 14 19.5V22C18.1 22 21.5 18.6 21.5 14.5V4Z"/></svg>
                </div>
                <div class="relative z-10 text-gray-700 text-sm sm:text-base md:text-lg leading-relaxed text-left md:text-justify space-y-4 font-medium">
                  <h3 class="text-xl md:text-2xl lg:text-3xl font-extrabold text-[#8C1C13] mb-4 uppercase" style="font-family: 'Arial Narrow', Arial, sans-serif;">{{ item.name }}</h3>
                  <p>
                    {{ item.description }}
                  </p>
                </div>
              </div>
            </ng-container>
            
          </div>
          
        </div>

      </div>

    </div>
  </div>
</div>
