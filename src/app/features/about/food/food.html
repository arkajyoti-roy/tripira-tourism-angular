<div class="w-full min-h-screen relative">
  
  <!-- Fixed Hero Background -->
  <img loading="lazy" src="/about/food/food.png" onerror="this.src='/dream-destination/natural-beauty.jpg'" class="fixed inset-0 w-full h-screen object-cover z-0" >
  <div class="fixed inset-0 bg-black/20 z-0 pointer-events-none"></div>

  <!-- Hero Section Content -->
  <div class="relative w-full h-screen flex flex-col items-center justify-center overflow-hidden z-10 bg-transparent pointer-events-none">
    
    <div class="text-center mt-16 pointer-events-auto">
      <h1 class="text-white text-[2.5rem] sm:text-[3.5rem] md:text-[4.5rem] font-normal tracking-wide leading-tight px-4" style="font-family: 'Impact', 'Arial Black', sans-serif;">
        Traditional Food <br> Cuisines of Tripura
      </h1>
      <p class="text-white/90 text-sm md:text-base font-medium mt-6 flex items-center gap-2 justify-center drop-shadow-md">
        <span class="hover:text-[#8C593B] cursor-pointer transition-colors" routerLink="/">Home</span> 
        <span class="text-xs">&gt;</span> 
        <span>Food Cuisines</span>
      </p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="relative z-20 w-full bg-[#e6e8e8] py-[100px] overflow-hidden">
    
    <!-- Faint Map Watermark -->
    <img loading="lazy" src="about/tripura-map-watermark.png" onerror="this.style.display='none'" class="absolute top-[5%] left-[5%] w-[80%] md:w-[50%] object-contain opacity-[0.05] pointer-events-none z-0">
    <img loading="lazy" src="about/tripura-map-watermark.png" onerror="this.style.display='none'" class="absolute top-[40%] right-[5%] w-[80%] md:w-[50%] object-contain opacity-[0.05] pointer-events-none z-0">
    <img loading="lazy" src="about/tripura-map-watermark.png" onerror="this.style.display='none'" class="absolute top-[80%] left-[10%] w-[80%] md:w-[50%] object-contain opacity-[0.05] pointer-events-none z-0">

    <div class="w-full max-w-[1200px] mx-auto px-4 sm:px-6 md:px-8 flex flex-col relative z-10 space-y-16 md:space-y-24">
      
      <!-- Food Items Loop -->
      <div *ngFor="let item of foodItems; let i = index" class="grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-16 items-center">
        
        <!-- Image Card Column -->
        <div class="md:col-span-4 flex justify-center" [class.md:order-last]="i % 2 !== 0">
          <div class="bg-white  shadow-lg w-full max-w-[500px] rounded-md">
            <img loading="lazy" [src]="item.image" class="w-full h-auto rounded-md">
            <!-- <h3 class="text-center font-bold text-xl mt-4 mb-2 text-black font-serif">
              {{ item.name }}
            </h3> -->
          </div>
        </div>
        
        <!-- Text Column -->
        <div class="md:col-span-8">
          <p class="text-gray-700 text-sm md:text-base leading-relaxed text-justify">
            {{ item.description }}
          </p>
        </div>

      </div>

    </div>
  </div>
</div>
