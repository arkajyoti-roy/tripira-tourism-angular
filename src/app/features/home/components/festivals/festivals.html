<section class=" py-12 w-full overflow-hidden border-t border-[#E9C35A]">
  <div class="w-full relative">
    
    <!-- Snap Scroll Container -->
    <div #slider class="flex gap-4 overflow-x-auto snap-x snap-mandatory hide-scrollbar pb-6 scroll-smooth px-4 w-full" (mouseenter)="pauseAutoScroll()" (mouseleave)="resumeAutoScroll()">
      @for (fest of festivals(); track fest.id) {
        <a [routerLink]="['/tour', fest.id]" [queryParams]="{type: 'featured'}" 
           class="snap-center shrink-0 w-full sm:w-[calc(50%-8px)] lg:w-[calc(33.333%-10.67px)] relative rounded-2xl overflow-hidden group cursor-pointer shadow-xl bg-gray-200">
          
          <!-- Image -->
          <img [src]="fest.image_url" [alt]="fest.name || 'Festival ' + fest.id" 
               loading="lazy" decoding="async" width="800" height="430"
               class="w-full h-[430px] object-cover transition-transform duration-700 group-hover:scale-110" 
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
               
          <!-- Fallback when image is missing -->
          <div class="w-full h-[300px] flex-col items-center justify-center text-gray-500 text-xs hidden">
            <span>[Image: {{fest.image}}]</span>
          </div>

          <!-- Gradient Overlay (Hidden by default, shown on hover) -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

          <!-- Bottom Text Label (Hidden by default, slides up on hover) -->
          <div *ngIf="fest.name" class="absolute bottom-6 left-0 w-full text-center px-4 opacity-0 translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-500">
            <h3 class="text-white font-black text-xl tracking-wider uppercase drop-shadow-md">{{ fest.name }}</h3>
          </div>
        </a>
      }
    </div>

    <!-- Navigation Arrows -->
    <div class="flex justify-center items-center gap-4 mt-6">
      <button (click)="scrollLeft(slider)" aria-label="Scroll Left" class="w-12 h-12 rounded-full bg-[#901A1E] text-white flex items-center cursor-pointer justify-center hover:bg-[#7a1519] transition-colors shadow-md">
        <span class="material-symbols-outlined font-bold text-2xl">chevron_left</span>
      </button>
      <button (click)="scrollRight(slider)" aria-label="Scroll Right" class="w-12 h-12 rounded-full bg-[#901A1E] text-white flex items-center justify-center hover:bg-[#7a1519] transition-colors shadow-md cursor-pointer">
        <span class="material-symbols-outlined font-bold text-2xl">chevron_right</span>
      </button>
    </div>
    
  </div>
</section>

<style>
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .hide-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
