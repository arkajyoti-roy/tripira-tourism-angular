<div class="w-full min-h-screen relative">
  
  <!-- Fixed Hero Background -->
  <div class="fixed inset-0 w-full h-screen z-0 bg-gradient-to-br from-[#8C593B] to-[#4A2E1B]">
    <img fetchpriority="high" src="/Ongoing_Projects.jpg" class="w-full h-full object-cover object-center">
    <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/30 to-black/70 pointer-events-none"></div>
  </div>

  <!-- Hero Section Content -->
  <div class="relative w-full h-screen flex flex-col items-center justify-center overflow-hidden z-10 bg-transparent pointer-events-none px-4">
    <div class="text-center mt-16 pointer-events-auto backdrop-blur-[2px] bg-black/10 p-6 md:p-8 lg:px-12 rounded-3xl border border-white/10 shadow-2xl transform transition-transform hover:scale-[1.02] duration-500 w-full max-w-[95%] sm:max-w-[80%] md:max-w-fit">
      <h1 class="text-white text-[1.8rem] sm:text-[2.5rem] md:text-[3.5rem] font-extrabold uppercase tracking-widest drop-shadow-2xl leading-[1.1] px-2 md:px-4" style="font-family: 'Arial Narrow', Arial, sans-serif;">
        <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#F2C14E] to-[#fff] text-[2.2rem] sm:text-[3rem] md:text-[4.5rem]">Ongoing Projects</span>
      </h1>
      <div class="w-24 md:w-32 h-1 bg-gradient-to-r from-transparent via-[#F2C14E] to-transparent mx-auto mt-4 md:mt-6 mb-4 md:mb-6"></div>
      <p class="text-white/90 text-xs sm:text-sm md:text-[1.1rem] font-medium flex items-center gap-2 md:gap-3 justify-center drop-shadow-md tracking-wider uppercase">
        <span class="hover:text-[#F2C14E] cursor-pointer transition-colors duration-300" routerLink="/">Home</span> 
        <span class="text-[#F2C14E]">&bull;</span> 
        <span class="hover:text-[#F2C14E] cursor-pointer transition-colors duration-300">Dept Info</span> 
        <span class="text-[#F2C14E]">&bull;</span> 
        <span class="text-white/70 text-center">Ongoing Projects</span>
      </p>
    </div>
  </div>

  <!-- Content Section -->
  <div class="relative z-20 w-full bg-gradient-to-b from-[#fdfbf7] to-[#f4eee6] shadow-[0_-10px_25px_rgba(0,0,0,0.1)] py-16 md:py-24 lg:py-[100px] overflow-hidden min-h-[40vh]">
    
    <!-- Decorative background elements -->
    <div class="absolute top-0 right-0 w-[300px] md:w-[600px] h-[300px] md:h-[600px] bg-[#F2C14E] rounded-full blur-[80px] md:blur-[150px] opacity-10 pointer-events-none transform translate-x-1/3 -translate-y-1/3"></div>
    <div class="absolute top-1/3 left-0 w-[300px] md:w-[600px] h-[300px] md:h-[600px] bg-[#8C1C13] rounded-full blur-[80px] md:blur-[150px] opacity-[0.08] pointer-events-none transform -translate-x-1/3 translate-y-1/3"></div>
    
    <div class="w-full max-w-[1300px] mx-auto px-4 relative z-10 flex flex-col items-center">
      
      <!-- Loading State -->
      @if (isLoading()) {
      <div class="w-full bg-white rounded-md shadow-sm border border-gray-200 p-8 flex justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600"></div>
      </div>
      }
      
      <!-- Error State -->
      @if (error()) {
      <div class="w-full bg-white rounded-md shadow-sm border border-gray-200 p-8 text-center text-red-500 font-medium">
        {{ error() }}
      </div>
      }
      
      <!-- Documents List Container -->
      @if (!isLoading()) {
      <div class="w-full mt-4">
        @if (documents().length > 0) {
        <div class="grid grid-cols-1 gap-6">
          @for (doc of documents(); track doc.id || doc.docid) {
          <div class="bg-white/80 backdrop-blur-md rounded-2xl shadow-sm border border-white/40 p-5 md:p-6 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative overflow-hidden group flex items-center justify-between gap-4">
            
            <!-- Left color bar -->
            <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-[#8C1C13] to-[#F2C14E] opacity-0 group-hover:opacity-100 transition-opacity"></div>
            
            <h3 class="flex items-center gap-4 m-0 flex-grow">
              <a [href]="getPDFUrl(doc)" target="_blank" rel="noopener noreferrer" class="flex-shrink-0 flex items-center justify-center bg-red-50 p-3 rounded-xl group-hover:bg-red-100 transition-colors shadow-sm">
                <img loading="lazy" style="height: 28px; width: 28px;" src="/images/pdf/application-pdf.png" alt="PDF">
              </a>
              <a [href]="getPDFUrl(doc)" target="_blank" rel="noopener noreferrer" class="text-[#333] group-hover:text-[#8C1C13] font-bold font-sans text-base md:text-lg transition-colors w-full line-clamp-2">
                {{ doc.des }}
              </a>
            </h3>
            
            <a [href]="getPDFUrl(doc)" target="_blank" rel="noopener noreferrer" class="flex-shrink-0 w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-[#8C1C13] group-hover:text-white transition-all shadow-sm">
              <span class="material-symbols-outlined text-[1.2rem]">download</span>
            </a>
          </div>
          }
        </div>
        } @else {
        <div class="w-full flex justify-center py-10 bg-white rounded-md shadow-sm border border-gray-100">
          <h2 class="text-gray-500 text-xl font-medium">No ongoing projects found.</h2>
        </div>
        }
      </div>
      }

    </div>
  </div>
</div>
